<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="app-version" content="2.6.0">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0C0D0F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Portfolio Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;700;900&family=Zen+Kaku+Gothic+New:wght@400;700;900&family=Oswald:wght@400;700&family=Inter:wght@400;700;900&family=Noto+Serif+JP:wght@400;700;900&display=swap">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
:root{--ui-bg:#17181B;--ui-panel:#1F2024;--ui-line:#2E3036;--ui-ink:#E8E6E1;--ui-muted:#9A9CA3;--ui-acc:#FF5A36;--sel:#3D8BFF}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#0A0A0B;color:var(--ui-ink);font-family:'Noto Sans JP',system-ui,sans-serif;font-size:13px;overflow:hidden}
#app{display:flex;height:100vh}
aside{background:var(--ui-bg);display:flex;flex-direction:column;min-height:0;flex-shrink:0}
#side{width:340px;border-right:1px solid var(--ui-line)}
#insp{width:290px;border-left:1px solid var(--ui-line)}
#side header{padding:14px 16px 0;display:flex;align-items:center;justify-content:space-between;gap:8px}
#side header h1{margin:0;font-family:'Archivo',sans-serif;font-stretch:125%;font-weight:900;font-size:15px;letter-spacing:.02em}
#side header h1 span{color:var(--ui-acc)}
#status{font-size:11px;color:var(--ui-muted);text-align:right}
.tabs{display:flex;gap:2px;padding:10px 10px 0;border-bottom:1px solid var(--ui-line)}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;color:var(--ui-muted);padding:8px 2px;font:inherit;font-weight:700;cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--ui-ink);border-bottom-color:var(--ui-acc)}
.scroll{flex:1;overflow:auto;padding:14px 14px 40px}
.sec{margin-bottom:18px}
.sec h3{margin:0 0 8px;font-size:11px;letter-spacing:.12em;color:var(--ui-muted);font-family:'JetBrains Mono',monospace;font-weight:500;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
label.f{display:block;margin-bottom:10px}
label.f>span{display:block;font-size:11px;color:var(--ui-muted);margin-bottom:4px}
input[type=text],input[type=url],input[type=number],textarea,select{width:100%;background:var(--ui-panel);border:1px solid var(--ui-line);color:var(--ui-ink);border-radius:6px;padding:6px 8px;font:inherit}
input[type=number]{padding:5px 6px}
textarea{resize:vertical;min-height:54px;line-height:1.5}
input:focus,textarea:focus,select:focus{outline:2px solid var(--ui-acc);outline-offset:-1px;border-color:transparent}
button.b{background:var(--ui-panel);border:1px solid var(--ui-line);color:var(--ui-ink);border-radius:6px;padding:6px 10px;font:inherit;cursor:pointer;min-height:30px;white-space:nowrap}
button.b:hover{border-color:var(--ui-muted)}
button.b.pri{background:var(--ui-acc);border-color:var(--ui-acc);color:#140904;font-weight:700}
button.b.sm{padding:3px 8px;min-height:26px;font-size:12px}
button.b.danger:hover{border-color:#e5484d;color:#ff8b8e}
button.b:disabled{opacity:.4;cursor:default}
button.b.on{border-color:var(--ui-acc);color:var(--ui-acc)}
.row{display:flex;gap:6px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.hint{font-size:11px;color:var(--ui-muted);line-height:1.6;margin:4px 0 10px}
.mini{font-size:10px;color:var(--ui-muted);display:block;margin-bottom:2px}
/* block list */
.blist{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.bitem{display:flex;align-items:center;gap:7px;background:var(--ui-panel);border:1px solid var(--ui-line);border-radius:8px;padding:5px 7px;cursor:pointer}
.bitem.sel{border-color:var(--ui-acc)}
.bitem.off{opacity:.45}
.bitem.dragover{outline:2px dashed var(--ui-acc)}
.bitem .grip{cursor:grab;color:var(--ui-muted);user-select:none}
.bitem .no{font-family:'Archivo',sans-serif;font-stretch:125%;font-weight:900;color:var(--ui-acc);width:24px;font-size:12px}
.bitem .kind{font-size:10px;color:var(--ui-muted);width:24px}
.bitem img,.bitem .noimg{width:48px;height:27px;object-fit:cover;border-radius:3px;background:#000;flex-shrink:0}
.bitem .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.ib{background:none;border:0;color:var(--ui-muted);cursor:pointer;padding:4px 4px;border-radius:4px;font-size:12px;line-height:1}
.ib:hover{color:var(--ui-ink);background:#ffffff14}
.card{background:var(--ui-panel);border:1px solid var(--ui-line);border-radius:8px;padding:10px;margin-bottom:10px}
.card h4{margin:0 0 8px;font-size:12px;display:flex;justify-content:space-between;align-items:center}
.cells{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cellEd{display:flex;flex-direction:column;gap:4px}
.drop{position:relative;aspect-ratio:16/9;background:#0E0F11;border:1px dashed var(--ui-line);border-radius:5px;display:flex;align-items:center;justify-content:center;color:var(--ui-muted);font-size:11px;cursor:pointer;overflow:hidden;text-align:center;padding:4px}
.drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.drop.over{border-color:var(--ui-acc);color:var(--ui-ink)}
.drop .x{position:absolute;top:3px;right:3px;background:#000c;color:#fff;border:0;border-radius:4px;cursor:pointer;font-size:11px;padding:2px 5px;z-index:2}
.metaRow{display:flex;gap:4px;margin-bottom:4px}
.metaRow input:first-child{width:90px;flex-shrink:0;font-family:'JetBrains Mono',monospace;font-size:12px}
.swatches{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.swatches label{display:flex;align-items:center;gap:8px;font-size:12px}
input[type=color]{width:32px;height:28px;border:1px solid var(--ui-line);border-radius:6px;background:none;padding:2px;cursor:pointer;flex-shrink:0}
input[type=range]{width:100%;accent-color:var(--ui-acc)}
.lib{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.lib .li{position:relative;aspect-ratio:16/9;background:#000;border-radius:4px;overflow:hidden;cursor:grab;border:1px solid var(--ui-line)}
.lib .li img{width:100%;height:100%;object-fit:cover;pointer-events:none}
.lib .li .u{position:absolute;left:3px;bottom:3px;font-size:9px;background:#000b;padding:1px 4px;border-radius:3px;color:#ccc}
.lib .li .x{position:absolute;top:2px;right:2px;display:none;background:#000c;color:#fff;border:0;border-radius:4px;cursor:pointer;font-size:10px;padding:1px 4px}
.lib .li:hover .x{display:block}
.issue{display:flex;gap:8px;align-items:flex-start;padding:7px 8px;border-radius:6px;cursor:pointer;line-height:1.5}
.issue:hover{background:#ffffff0d}
.issue .tag{font-size:10px;padding:1px 6px;border-radius:4px;background:#ff5a3622;color:var(--ui-acc);white-space:nowrap;margin-top:2px}
.issue.ok .tag{background:#3dd68c22;color:#3dd68c}
kbd{font-family:'JetBrains Mono',monospace;font-size:11px;background:var(--ui-panel);border:1px solid var(--ui-line);border-radius:4px;padding:0 5px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:5px 10px;font-size:12px;color:var(--ui-muted)}
/* stage */
#stage{flex:1;overflow:auto;min-width:0;position:relative}
#toolbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:8px 16px;background:#0A0A0BEE;border-bottom:1px solid var(--ui-line);backdrop-filter:blur(6px);flex-wrap:wrap}
#toolbar .sp{flex:1}
#toolbar .grp{display:flex;gap:4px;align-items:center;padding-right:8px;border-right:1px solid var(--ui-line)}
#todo{font-size:12px;color:var(--ui-muted);cursor:pointer}
#todo b{color:var(--ui-acc)}
#pages{display:flex;flex-direction:column;align-items:flex-start;gap:30px;padding:30px 20px 120px;width:max-content;min-width:100%;box-sizing:border-box}
.pbox{position:relative;flex-shrink:0;box-shadow:0 8px 30px #0008;margin:0 auto}
#zoomPct{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ui-ink);width:44px;text-align:right}
.lb{position:fixed;inset:0;z-index:150;background:#000E;display:none;overflow:hidden;cursor:grab}
.lb.show{display:block}
.lb.drag{cursor:grabbing}
.lb img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;user-select:none;-webkit-user-drag:none;image-rendering:auto}
.lb .bar{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;background:#17181BEE;border:1px solid var(--ui-line);border-radius:10px;padding:6px 10px;font-size:12px;color:var(--ui-muted);cursor:default}
.lb .bar b{color:var(--ui-ink);font-family:'JetBrains Mono',monospace;font-weight:500;min-width:48px;text-align:right}
.pbox .plabel{position:absolute;top:-21px;left:0;font-size:11px;color:var(--ui-muted);font-family:'JetBrains Mono',monospace;white-space:nowrap}
.pbox.act .plabel{color:var(--ui-acc)}
.pbox.selb{outline:2px solid var(--ui-acc);outline-offset:4px}
.pscale{transform-origin:0 0;position:relative;width:1123px;height:794px}
.sellayer{position:absolute;inset:0;pointer-events:none;z-index:50}
.sbox{position:absolute;border:1.5px solid var(--sel);pointer-events:none}
.sbox.multi{border-style:dashed}
.hd{position:absolute;width:12px;height:12px;background:#fff;border:1.5px solid var(--sel);border-radius:2px;pointer-events:auto;transform:translate(-50%,-50%)}
.guide{position:absolute;background:#FF3DCB;pointer-events:none}
.dropmark{outline:3px solid var(--sel)!important;outline-offset:-3px}
/* ===== portfolio page styles ===== */
.page{width:1123px;height:794px;position:relative;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--fb);display:flex;flex-direction:column}
.page *{box-sizing:border-box}
.page .exp{font-family:var(--fh);font-stretch:var(--stretch)}
.page .mono{font-family:var(--fm)}
.page .ph{color:var(--acc)}
.page .muted{color:var(--muted)}
.page img{display:block}
.layer{position:absolute;inset:0;pointer-events:none;z-index:10}
.free .layer{pointer-events:auto}
.el{position:absolute;pointer-events:auto;cursor:move;transform-origin:50% 50%}
.el.locked{cursor:default}
.el-text{white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
.el-text[contenteditable]{cursor:text;outline:1.5px dashed var(--sel);outline-offset:2px}
.el-image img{width:100%;height:100%;display:block}
.el .empty{width:100%;height:100%}
.el-line>i{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);display:block}
.pad{padding:44px 48px;justify-content:space-between}
.foot{display:flex;justify-content:space-between;align-items:center;font-family:var(--fm);font-size:12px;color:var(--muted);letter-spacing:.06em}
.hdr{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:12px;border-bottom:1px solid var(--line)}
.meta>div{display:flex;flex-direction:column;gap:3px;padding:9px 0;border-top:1px solid var(--line)}
.meta .k{font-family:var(--fm);font-size:12px;color:var(--muted);letter-spacing:.08em}
.meta .v{font-size:14px;line-height:1.55}
.desc{margin:0;font-size:14px;line-height:1.75;text-wrap:pretty}
.fill{width:100%;height:100%;object-fit:cover;background:#000}
.empty{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:var(--panel);border:1px dashed var(--acc);text-align:center;padding:12px;font-family:var(--fb)}
.empty b{color:var(--acc);font-size:15px}
.empty span{color:var(--muted);font-size:12px}
.hero-img{width:1123px;height:632px;flex-shrink:0;position:relative;background:#000}
.hero-band{height:162px;padding:0 48px;display:flex;align-items:center;gap:32px;border-top:2px solid var(--acc)}
.hero-no{font-family:var(--fh);font-stretch:var(--stretch);font-weight:900;font-size:96px;line-height:1;color:var(--acc)}
.hero-t{margin:0;line-height:1.05}
.hero-t.lat{font-family:var(--fh);font-stretch:var(--stretch);font-weight:800;font-size:46px;letter-spacing:-.01em}
.upper{text-transform:uppercase}
.hero-t.jp{font-family:var(--fb);font-weight:900;font-size:40px;letter-spacing:.02em}
.hero-tags{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-family:var(--fm);font-size:12px;letter-spacing:.08em;color:var(--muted);white-space:nowrap}
.dbody{display:flex;gap:40px;align-items:flex-start}
.dleft{width:300px;flex-shrink:0;display:flex;flex-direction:column;gap:16px}
.grid{flex:1;min-width:0;display:grid;gap:12px;height:594px}
.grid.g6{grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr)}
.grid.g4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.grid.g3{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.grid.g3>:first-child{grid-column:1 / 3}
.grid.g2{grid-template-columns:1fr;grid-template-rows:1fr 1fr}
.grid.g1{grid-template-columns:1fr;grid-template-rows:1fr}
.cell{position:relative;overflow:hidden;background:#000;min-height:0}
.cell>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cell .cap{position:absolute;left:8px;bottom:8px;padding:3px 8px;background:rgba(12,13,15,.85);color:#ECEAE4;font-family:var(--fm);font-size:12px}
.cell.contain{background:transparent}
.cw{display:flex;flex-direction:column;gap:6px;min-height:0;min-width:0}
.cw>.cell{flex:1}
.capb{font-family:var(--fm);font-size:12px;color:var(--muted);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.02em}
.qr{display:flex;gap:12px;align-items:center;padding:12px;background:var(--panel)}
.qr .code{width:64px;height:64px;flex-shrink:0;background:#fff;padding:4px;display:flex;align-items:center;justify-content:center}
.qr .code svg{width:100%;height:100%}
.qr .code.none{background:none;border:1px dashed var(--acc);color:var(--acc);font-family:var(--fm);font-size:12px}
.widx{display:flex;gap:18px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.widx img,.widx .noimg{object-fit:cover;background:#000;flex-shrink:0}
@media print{
  @page{size:1123px 794px;margin:0}
  html,body{background:none;height:auto;overflow:visible}
  #app{display:block;height:auto}
  aside,#toolbar,.plabel,.sellayer,.toast,.gate,#banner,.menu{display:none!important}
  #stage{overflow:visible}
  #pages{display:block;padding:0}
  .pbox{width:1123px!important;height:794px!important;box-shadow:none;outline:none!important;break-after:page;page-break-after:always}
  .pbox:last-child{break-after:auto;page-break-after:auto}
  .pscale{transform:none!important}
  .page{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .el-text[contenteditable]{outline:none}
  .noprint{display:none!important}
}
.gate{position:fixed;inset:0;z-index:200;background:#0A0A0BF2;display:flex;align-items:center;justify-content:center}
.gate .box{width:min(520px,92vw);background:var(--ui-bg);border:1px solid var(--ui-line);border-radius:14px;padding:28px}
.gate h2{margin:0 0 10px;font-family:'Archivo',sans-serif;font-stretch:125%;font-weight:900;font-size:20px}
.gate h2 span{color:var(--ui-acc)}
.gate p{color:var(--ui-muted);line-height:1.8;margin:0 0 18px}
.gate .row{gap:10px}
#banner{display:none;position:sticky;top:45px;z-index:19;margin:0;padding:10px 16px;background:#2A1A12;border-bottom:1px solid #FF5A3666;color:var(--ui-ink);font-size:13px;align-items:center;gap:10px}
#banner.show{display:flex}
#banner .sp{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.chip{background:var(--ui-panel);border:1px solid var(--ui-line);color:var(--ui-muted);border-radius:999px;padding:3px 10px;font:inherit;font-size:12px;cursor:pointer;min-height:26px}
.chip:hover{color:var(--ui-ink);border-color:var(--ui-muted)}
.chip.on{background:#FF5A361F;border-color:var(--ui-acc);color:var(--ui-ink)}
.chip.add{border-style:dashed}
.olist{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}
.olist .oi{display:flex;align-items:center;gap:6px;background:var(--ui-panel);border:1px solid var(--ui-line);border-radius:6px;padding:4px 8px}
.olist .oi .t{flex:1}
.preview{font-size:12px;color:var(--ui-ink);background:#0E0F11;border:1px solid var(--ui-line);border-radius:6px;padding:6px 8px;margin:-4px 0 10px;white-space:pre-wrap}
.preview::before{content:'表示：';color:var(--ui-muted)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#000;border:1px solid var(--ui-line);color:var(--ui-ink);padding:9px 16px;border-radius:8px;font-size:13px;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.menu{position:absolute;z-index:40;background:var(--ui-bg);border:1px solid var(--ui-line);border-radius:8px;padding:4px;box-shadow:0 10px 30px #000a;min-width:200px}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--ui-ink);padding:7px 10px;border-radius:5px;font:inherit;cursor:pointer}
.menu button:hover{background:#ffffff12}
.menu small{display:block;color:var(--ui-muted);font-size:11px}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <header><h1>PORTFOLIO<span>.</span>BUILDER</h1><div id="status"></div></header>
    <nav class="tabs" id="tabs"></nav>
    <div class="scroll" id="panel"></div>
  </aside>
  <main id="stage">
    <div id="toolbar">
      <div class="grp"><button class="b sm" id="undoBtn" title="元に戻す (Ctrl+Z)">↶</button><button class="b sm" id="redoBtn" title="やり直す (Ctrl+Shift+Z)">↷</button></div>
      <div class="grp"><span style="font-size:11px;color:var(--ui-muted)">追加</span>
        <button class="b sm" data-add="text" title="テキストを追加">T テキスト</button>
        <button class="b sm" data-add="image" title="画像枠を追加">▣ 画像</button>
        <button class="b sm" data-add="rect" title="四角形を追加">■ 図形</button>
        <button class="b sm" data-add="line" title="線を追加">― 線</button>
        <button class="b sm" id="tokBtn" title="氏名などを自動で入れるテキスト">{ } 自動テキスト</button>
      </div>
      <span id="todo"></span>
      <span class="sp"></span>
      <span class="row" style="gap:4px;color:var(--ui-muted);font-size:12px">表示 <button class="b sm" id="zoomOut" title="縮小">−</button><input type="range" id="zoom" min="0.2" max="4" step="0.05" style="width:110px"><button class="b sm" id="zoomIn" title="拡大">＋</button><span id="zoomPct"></span><button class="b sm" id="zoomFit" title="画面の幅に合わせる">全体</button><button class="b sm" id="zoom100" title="実寸（100%）">100%</button></span>
      <button class="b sm pri" id="pdfBtn">PDFに書き出す</button>
    </div>
    <div id="banner"></div>
    <div id="pages"></div>
  </main>
  <aside id="insp"><div class="scroll" id="inspPanel"></div></aside>
</div>
<input type="file" id="filePick" accept="image/*" hidden>
<input type="file" id="multiPick" accept="image/*" multiple hidden>
<input type="file" id="jsonPick" accept=".json,application/json" hidden>
<div class="toast" id="toast"></div>
<div class="lb" id="lb"><img id="lbImg" alt=""><div class="bar"><span>ホイールで拡大縮小・ドラッグで移動</span><b id="lbPct"></b><button class="b sm" id="lbFit">全体</button><button class="b sm" id="lb100">等倍</button><button class="b sm" id="lbClose">閉じる (Esc)</button></div></div>
<div class="gate" id="gate" style="display:none"><div class="box" id="gateBox"></div></div>

<script>
const DEFAULT_IMAGES = {};
</script>
<script>
'use strict';
// =====================================================================
//  constants
// =====================================================================
const PW = 1123, PH = 794;
const THEMES = {
  dark:{accent:'#FF5A36', bg:'#0C0D0F', ink:'#ECEAE4', muted:'#9C9EA6', line:'#2A2D33', panel:'#16181C'},

  try {
    const f = await projFile();
    if (f.lastModified > lastMtime + 1){
      if (dirty) return showConflict();
      await loadFromDir(dirHandle, {silent:true}); toast('別のPC（またはClaude）の変更を読み込みました');
    }
  } catch(e){}
}
let lastUpdCheck = 0;
const HOSTED = location.protocol.startsWith('http');
async function checkUpdate(){
  if (Date.now() - lastUpdCheck < (HOSTED ? 60000 : 30000)) return; lastUpdCheck = Date.now();
  if (bannerKind === 'update') return;
  if (HOSTED){
    try { const r = await fetch('./version.json', {cache:'no-store'}); const j = await r.json(); if (cmpVer(j.version, APP_VERSION) > 0) showBanner('update', `ツールの新しいバージョン（${esc(j.version)}）が届いています。${j.note ? '<span style="color:var(--ui-muted)">　' + esc(j.note) + '</span>' : ''}`, [['今すぐ更新', 'doUpdate']]); } catch(e){}
    return;
  }
  if (!folderReady) return;
  try {
    for await (const [name, h] of dirHandle.entries()){
      if (h.kind !== 'file' || !name.toLowerCase().endsWith('.html')) continue;
      const head = await (await h.getFile()).slice(0, 4000).text();
      const m = head.match(/name="app-version" content="([\d.]+)"/);
      if (m && cmpVer(m[1], APP_VERSION) > 0){ showBanner('update', `ツールの新しいバージョン（${m[1]}）が届いています。`, [['今すぐ更新', 'doUpdate']], name); return; }
    }
  } catch(e){}
}
function cmpVer(a, b){ const x = a.split('.').map(Number), y = b.split('.').map(Number); for (let i = 0; i < 3; i++){ if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) - (y[i] || 0); } return 0; }
let bannerKind = null, bannerFile = null;
function showBanner(kind, msg, buttons, file){ bannerKind = kind; bannerFile = file || null; const b = $('#banner'); b.innerHTML = `<span>${msg}</span><span class="sp"></span>${buttons.map(([l, a]) => `<button class="b sm ${a === 'doUpdate' || a === 'loadRemote' ? 'pri' : ''}" data-ban="${a}">${l}</button>`).join('')}`; b.classList.add('show'); }
function hideBanner(kind){ if (!kind || bannerKind === kind){ $('#banner').classList.remove('show'); bannerKind = null; } }
function showConflict(){ if (bannerKind === 'conflict') return; showBanner('conflict', '別のPC（またはClaude）がこのプロジェクトを変更しました。こちらにも未保存の変更があります。', [['向こうの変更を読み込む', 'loadRemote'], ['こちらで上書き', 'overwrite']]); }
$('#banner').addEventListener('click', async e => {
  const a = e.target.closest('[data-ban]')?.dataset.ban; if (!a) return;
  if (a === 'loadRemote'){ dirty = false; hideBanner(); await loadFromDir(dirHandle, {silent:true}); toast('読み込みました'); }
  if (a === 'overwrite'){ hideBanner(); await folderSave(true); toast('こちらの内容で保存しました'); }
  if (a === 'doUpdate'){
    if (dirty) await folderSave();
    const here = decodeURIComponent(location.pathname.split('/').pop() || '');
    if (!HOSTED && bannerFile && here && here !== bannerFile){ toast(`フォルダ内の「${bannerFile}」を開き直してください（今開いているのは別の場所のファイルです）`); return; }
    location.reload();
  }
});
setInterval(() => { checkRemote(); checkUpdate(); }, 3000);
document.addEventListener('visibilitychange', () => { if (!document.hidden){ lastUpdCheck = 0; checkRemote(); checkUpdate(); } });
window.addEventListener('beforeunload', e => { if (dirty && folderReady){ folderSave(); e.preventDefault(); e.returnValue = ''; } });
// ---------- startup gate ----------
function gate(html){ $('#gateBox').innerHTML = html; $('#gate').style.display = html ? 'flex' : 'none'; }
async function connectFolder(h){
  dirHandle = h; await DB.set('dir', h);
  let has = false; try { await h.getFileHandle('project.json'); has = true; } catch(e){}
  folderReady = true;
  if (has) await loadFromDir(h, {silent:true}); else { await folderSave(true); toast(`「${h.name}」に今の内容を保存しました。これからは自動で保存されます`); }
  gate(''); renderSide(); setStatus();
}
async function startFolder(){
  if (!('showDirectoryPicker' in window)){ gate(''); return; }
  if (dirHandle){
    let st = 'prompt'; try { st = await dirHandle.queryPermission({mode:'readwrite'}); } catch(e){}
    if (st === 'granted'){ try { await connectFolder(dirHandle); return; } catch(e){} }
    gate(`<h2>PORTFOLIO<span>.</span>BUILDER</h2><p>プロジェクトフォルダ「<b style="color:var(--ui-ink)">${esc(dirHandle.name)}</b>」を開きます。<br>ブラウザから確認が出たら許可してください（「毎回許可」を選ぶと次からこの画面は出ません）。</p>
      <div class="row wrap"><button class="b pri" id="gOpen">開く</button><button class="b" id="gPick">別のフォルダを選ぶ</button></div>`);
    $('#gOpen').onclick = async () => { try { if ((await dirHandle.requestPermission({mode:'readwrite'})) === 'granted') await connectFolder(dirHandle); else toast('許可されませんでした'); } catch(e){ toast('開けませんでした：' + e.message); } };
  } else {
    gate(`<h2>PORTFOLIO<span>.</span>BUILDER</h2><p>このPCで初めて開きました。<br>Googleドライブの中の <b style="color:var(--ui-ink)">portfolio</b> フォルダ（project.json が入っているフォルダ）を選んでください。<br>以後はそのフォルダのデータを自動で読み込み、自動で保存します。</p>
      <div class="row wrap"><button class="b pri" id="gPick">フォルダを選ぶ</button><button class="b" id="gSkip">フォルダなしで使う</button></div>`);
    $('#gSkip').onclick = () => gate('');
  }
  $('#gPick').onclick = async () => { try { const h = await window.showDirectoryPicker({mode:'readwrite', id:'portfolio'}); await connectFolder(h); } catch(e){ if (e.name !== 'AbortError') toast('開けませんでした：' + e.message); } };
}

// =====================================================================
//  history
// =====================================================================
function snapshot(){ const s = JSON.stringify(P); if (s !== lastSnap){ if (lastSnap) undoStack.push(lastSnap); if (undoStack.length > 100) undoStack.shift(); redoStack = []; lastSnap = s; } updUndo(); }
let snapTimer = null;
function snapshotSoon(){ clearTimeout(snapTimer); snapTimer = setTimeout(snapshot, 700); }
function undo(){ clearTimeout(snapTimer); snapshot(); if (!undoStack.length) return; redoStack.push(lastSnap); lastSnap = undoStack.pop(); P = JSON.parse(lastSnap); afterLoad(); }
function redo(){ if (!redoStack.length) return; undoStack.push(lastSnap); lastSnap = redoStack.pop(); P = JSON.parse(lastSnap); afterLoad(); }
function afterLoad(toFolder = true){ selBlock = Math.max(0, Math.min(selBlock, P.blocks.length - 1)); SEL = {ctx:null, ids:[]}; EDITING = null; renderAll(); persist(toFolder); }
function updUndo(){ $('#undoBtn').disabled = !undoStack.length && JSON.stringify(P) === lastSnap; $('#redoBtn').disabled = !redoStack.length; }
// structural: rerender everything + snapshot; light: rerender pages only
function changed(structural){ persist(); if (structural){ snapshot(); renderAll(); } else { snapshotSoon(); renderPages(); renderInspSoft(); } }

// =====================================================================
//  images
// =====================================================================
function dataURLtoBlob(u){ const [h, b] = u.split(','); const mime = (h.match(/data:([^;]+)/) || [, 'image/jpeg'])[1]; const bin = atob(b); const arr = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i); return new Blob([arr], {type:mime}); }
function src(id){ if (!id || !IM[id]) return ''; if (!URLC[id]) { try { URLC[id] = URL.createObjectURL(dataURLtoBlob(IM[id])); } catch(e){ URLC[id] = IM[id]; } } return URLC[id]; }
function readImage(file){
  return new Promise((res, rej) => {
    if (!file || !file.type.startsWith('image/')) return rej(new Error('画像ファイルではありません'));
    const fr = new FileReader();
    fr.onload = () => {
      const url = fr.result; const img = new Image();
      img.onload = () => {
        const MAX = 2400;
        if (img.width <= MAX && file.size < 2.5e6) return res(url);
        const s = Math.min(1, MAX / img.width); const c = document.createElement('canvas');
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL(file.type === 'image/png' ? 'image/png' : 'image/jpeg', 0.92));
      };
      img.onerror = () => res(url); img.src = url;
    };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}
async function addImageFile(file){ const url = await readImage(file); const id = uid('img'); IM[id] = url; return id; }
function imgRatio(id){ return new Promise(res => { const i = new Image(); i.onload = () => res(i.width / i.height || 16/9); i.onerror = () => res(16/9); i.src = src(id); }); }
function usedImageIds(){
  const s = new Set();
  const walkEls = els => (els || []).forEach(e => { if (e.type === 'image' && e.image.src && !e.image.src.startsWith('auto:')) s.add(e.image.src); });
  P.blocks.forEach(b => {
    if (b.type === 'work'){ if (b.hero) s.add(b.hero); walkEls(b.heroExtras); b.details.forEach(d => { d.cells.forEach(c => c.img && s.add(c.img)); walkEls(d.extras); }); }
    if (b.type === 'free') walkEls(b.elements);
    if (b.type === 'profile') walkEls(b.extras);
  });
  return s;
}
function imgUseCount(){ const m = {}; const add = id => { if (id) m[id] = (m[id] || 0) + 1; };
  const walkEls = els => (els || []).forEach(e => { if (e.type === 'image') add(e.image.src); });
  P.blocks.forEach(b => { if (b.type === 'work'){ add(b.hero); walkEls(b.heroExtras); b.details.forEach(d => { d.cells.forEach(c => add(c.img)); walkEls(d.extras); }); } if (b.type === 'free') walkEls(b.elements); if (b.type === 'profile') walkEls(b.extras); });
  return m; }
// put an image (file or library id) onto a target path. path ends with the property to set.
async function setImageAt(path, fileOrId){
  try { const id = typeof fileOrId === 'string' ? fileOrId : await addImageFile(fileOrId); setPath(path, id); changed(true); toast('画像を入れました'); }
  catch(e){ toast(e.message); }
}
let pickCb = null;
function pickImage(cb){ pickCb = cb; $('#filePick').value = ''; $('#filePick').click(); }
$('#filePick').addEventListener('change', async e => { const f = e.target.files[0]; if (f && pickCb){ try { const id = await addImageFile(f); pickCb(id); } catch(err){ toast(err.message); } } });
$('#multiPick').addEventListener('change', async e => { const fs = [...e.target.files]; for (const f of fs){ try { await addImageFile(f); } catch(err){} } persist(); renderSide(); toast(`${fs.length} 枚の画像を素材に追加しました`); });

function applyTheme(){
  const t = P.theme, r = document.documentElement.style;
  r.setProperty('--acc', t.accent); r.setProperty('--bg', t.bg); r.setProperty('--ink', t.ink); r.setProperty('--muted', t.muted); r.setProperty('--line', t.line); r.setProperty('--panel', t.panel);
  r.setProperty('--fh', fontStack(t.headingFont, fontStack(t.bodyFont, 'sans-serif')));
  r.setProperty('--fb', fontStack(t.bodyFont, "'Noto Sans JP', sans-serif"));
  r.setProperty('--fm', fontStack(t.monoFont, "'Noto Sans JP', monospace"));
  r.setProperty('--stretch', t.expanded ? '125%' : '100%');
}

// =====================================================================
//  page model
// =====================================================================
function enabledWorks(){ return P.blocks.map((b, bi) => ({b, bi})).filter(x => x.b.type === 'work' && x.b.enabled); }
function buildPages(){
  const pages = []; let wn = 0;
  const works = [];
  P.blocks.forEach((b, bi) => {
    if (!b.enabled) return;
    if (b.type === 'free') pages.push({kind:'free', b, bi, ctx:`blocks.${bi}.elements`});
    else if (b.type === 'profile') pages.push({kind:'profile', b, bi, ctx:`blocks.${bi}.extras`});
    else if (b.type === 'work'){
      wn++; const x = {b, bi, no:pad2(wn), page:pages.length + 1}; works.push(x);
      pages.push({kind:'hero', ...x, ctx:`blocks.${bi}.heroExtras`});
      b.details.forEach((d, di) => pages.push({kind:'detail', ...x, d, di, ctx:`blocks.${bi}.details.${di}.extras`}));
    }
  });
  pages.forEach((p, i) => { p.n = i + 1; });
  return {pages, works, total:pages.length};
}
function resolveImg(s, M){ if (!s) return ''; const m = /^auto:hero:(\d+)$/.exec(s); if (m){ const w = M.works[+m[1] - 1]; return w ? w.b.hero : ''; } return s; }
function autoPos(s, M){ const m = /^auto:hero:(\d+)$/.exec(s || ''); if (m){ const w = M.works[+m[1] - 1]; if (w) return [w.b.heroX, w.b.heroY]; } return null; }
function fillTokens(s, pg, M){
  const pr = P.profile;
  const map = {name:pr.name, kana:pr.kana, romaji:pr.romaji, school:pr.school, email:pr.email, position:pr.position, tools:profileTools(), roles:pr.roles, year:pr.year, label:pr.coverLabel, page:pad2(pg.n), total:pad2(M.total), works:String(M.works.length)};
  return String(s ?? '').replace(/\{(\w+)\}/g, (m, k) => k in map ? map[k] : m);
}

// =====================================================================
//  element rendering
// =====================================================================
function fontCSS(t){
  if (t.font === 'heading') return `font-family:var(--fh);font-stretch:${t.stretch === false ? '100%' : 'var(--stretch)'};`;
  if (t.font === 'body') return 'font-family:var(--fb);';
  if (t.font === 'mono') return 'font-family:var(--fm);';
  return `font-family:${fontStack(t.font, 'var(--fb)')};`;
}
function elBoxStyle(e){ return `left:${e.x}px;top:${e.y}px;width:${e.w}px;height:${e.h}px;${e.rot ? `transform:rotate(${e.rot}deg);` : ''}${e.opacity != null && e.opacity < 1 ? `opacity:${e.opacity};` : ''}`; }
function elHTML(e, pg, M, ctx, idx){
  if (e.hidden) return '';
  const base = `class="el el-${e.type}${e.locked ? ' locked' : ''}" data-eid="${e.id}" data-ctx="${ctx}" style="${elBoxStyle(e)}z-index:${idx + 1};`;
  if (e.type === 'text'){
    const t = e.text, ed = EDITING === e.id;
    const st = `${fontCSS(t)}font-size:${t.size}px;font-weight:${t.weight};color:${col(t.color)};text-align:${t.align};line-height:${t.lh};letter-spacing:${t.ls}em;${t.upper ? 'text-transform:uppercase;' : ''}${t.italic ? 'font-style:italic;' : ''}`;
    return `<div ${base}${st}" ${ed ? 'contenteditable="plaintext-only" spellcheck="false"' : ''}>${ed ? esc(t.content) : rich(fillTokens(t.content, pg, M))}</div>`;
  }
  if (e.type === 'image'){
    const im = e.image, id = resolveImg(im.src, M); const ap = autoPos(im.src, M);
    const pos = ap && im.px === 50 && im.py === 50 ? ap : [im.px, im.py];
    const inner = id && IM[id]
      ? `<img src="${src(id)}" alt="" draggable="false" style="object-fit:${im.fit};object-position:${pos[0]}% ${pos[1]}%;border-radius:${im.radius}px;${im.gray ? 'filter:grayscale(1);' : ''}">`
      : `<div class="empty" style="border-radius:${im.radius}px"><b>[${esc(e.name || '画像')}]</b><span>${im.src && im.src.startsWith('auto:') ? '対応する作品がありません' : '画像をドロップ / ダブルクリック'}</span></div>`;
    return `<div ${base}">${inner}</div>`;
  }
  if (e.type === 'rect'){ const r = e.rect; return `<div ${base}background:${col(r.fill)};${r.sw ? `border:${r.sw}px solid ${col(r.stroke || 'ink')};` : ''}border-radius:${r.radius}px"></div>`; }
  if (e.type === 'line'){ const l = e.line; return `<div ${base}"><i style="height:${l.sw}px;background:${col(l.color)}"></i></div>`; }
  return '';
}
function layerHTML(els, pg, M, ctx){ return `<div class="layer" data-ctx="${ctx}">${(els || []).map((e, i) => elHTML(e, pg, M, ctx, i)).join('')}</div>`; }

    : `<div class="empty" data-drop="${path}"><b>[${esc(label)}]</b><span>${esc(hint || 'ここに画像をドロップ')}</span></div>`;

function renderFree(pg, M){ return `<div class="page free" style="background:${col(pg.b.bg || 'bg')}">${layerHTML(pg.b.elements, pg, M, pg.ctx)}</div>`; }

// snapping
function snapCands(ctx, exclude){

function snapAxis(vals, cands, th){ let best = null; vals.forEach((v, i) => cands.forEach(c => { const d = c - v; if (Math.abs(d) <= th && (!best || Math.abs(d) < Math.abs(best.d))) best = {d, at:c}; })); return best; }
let DRAG = null;

    if (!e.altKey){

// element operations
function addElement(ctx, el){ if (!ctx){ toast('追加先のページをクリックしてから追加してください'); return; } const arr = getPath(ctx); if (!arr) return; arr.push(fixEl(el)); SEL = {ctx, ids:[el.id]}; ACTIVE = ctx; changed(true); }
function addByType(type){
  const ctx = ACTIVE; const cx = PW / 2, cy = PH / 2;
  if (type === 'text') addElement(ctx, E('text', cx - 200, cy - 30, 400, 60, {name:'テキスト', text:T('テキストを入力', {size:32})}));
  if (type === 'image') addElement(ctx, E('image', cx - 240, cy - 135, 480, 270, {name:'画像', image:{src:'', fit:'cover', px:50, py:50, radius:0, gray:false}}));
  if (type === 'rect') addElement(ctx, E('rect', cx - 150, cy - 100, 300, 200, {name:'図形', rect:{fill:'accent', stroke:'', sw:0, radius:0}}));
  if (type === 'line') addElement(ctx, E('line', cx - 200, cy - 5, 400, 10, {name:'線', line:{color:'accent', sw:2}}));
}
function deleteSel(){ if (!SEL.ids.length) return; const arr = ctxEls(SEL.ctx); const keep = arr.filter(e => !SEL.ids.includes(e.id) || e.locked); arr.length = 0; arr.push(...keep); SEL.ids = []; changed(true); }

function paste(){ if (!CLIP.length) return; const ctx = ACTIVE; if (!ctx) return; const arr = getPath(ctx); const same = ctx === SEL.ctx; const copies = CLIP.map(e => ({...clone(e), id:uid('e'), x:same ? e.x + 16 : e.x, y:same ? e.y + 16 : e.y})); arr.push(...copies); SEL = {ctx, ids:copies.map(c => c.id)}; changed(true); }

function reorder(mode){

}
function align(mode){

  els.forEach(e => {
    if (mode === 'l') e.x = ref.x; if (mode === 'c') e.x = Math.round(ref.x + ref.w / 2 - e.w / 2); if (mode === 'r') e.x = ref.x + ref.w - e.w;

// =====================================================================
//  keyboard
// =====================================================================
document.addEventListener('keydown', e => {
  const mod = e.ctrlKey || e.metaKey; const ae = document.activeElement;
  const typing = ae && (['INPUT', 'TEXTAREA', 'SELECT'].includes(ae.tagName) || ae.isContentEditable);
  if (mod && e.key.toLowerCase() === 's'){ e.preventDefault(); if ('showDirectoryPicker' in window) saveToDir(); else exportJson(); return; }
  if (EDITING && e.key === 'Escape'){ e.preventDefault(); ae.blur(); finishEdit(); return; }
  if (typing) return;
  if (mod && e.key.toLowerCase() === 'z'){ e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && e.key.toLowerCase() === 'y'){ e.preventDefault(); redo(); return; }
  if (mod && e.key.toLowerCase() === 'd'){ e.preventDefault(); duplicateSel(); return; }
  if (mod && e.key.toLowerCase() === 'c'){ copySel(); return; }
  if (mod && e.key.toLowerCase() === 'v'){ e.preventDefault(); paste(); return; }
  if (mod && e.key.toLowerCase() === 'a' && ACTIVE){ e.preventDefault(); setSel(ACTIVE, ctxEls(ACTIVE).filter(x => !x.hidden).map(x => x.id)); return; }
  if (!SEL.ids.length) return;
  if (e.key === 'Delete' || e.key === 'Backspace'){ e.preventDefault(); deleteSel(); return; }
  if (e.key === 'Escape'){ setSel(null, []); return; }
  if (e.key === 'Enter'){ const el = selEls()[0]; if (el && el.type === 'text' && !el.locked){ e.preventDefault(); EDITING = el.id; doRenderPages(); } return; }
  const st = e.shiftKey ? 10 : 1;
  const mv = {ArrowLeft:[-st, 0], ArrowRight:[st, 0], ArrowUp:[0, -st], ArrowDown:[0, st]}[e.key];
  if (mv){ e.preventDefault(); nudge(...mv); }
  if (mod && e.key === ']'){ e.preventDefault(); reorder(e.shiftKey ? 'front' : 'up'); }
  if (mod && e.key === '['){ e.preventDefault(); reorder(e.shiftKey ? 'back' : 'down'); }
});

function colorField(path, value, label){
  const isTok = COLOR_TOKENS.some(([k]) => k === value);
  const hex = isTok ? '' : (value || '#ffffff');

function issues(){
  const M = buildPages(); const out = [];
  const ph = s => (String(s || '').match(/\[[^\]\n]*\]/g) || []);
  const push = (bi, where, msg, kind) => out.push({bi, where, msg, kind:kind || '未記入'});
  const pr = P.profile; ['name', 'kana', 'romaji', 'school', 'email', 'position', 'intro', 'roles'].forEach(k => ph(pr[k]).forEach(x => push(-1, 'プロフィール', x)));
  P.blocks.forEach((b, bi) => {
    if (!b.enabled) return;
    const elsCheck = (els, where) => (els || []).forEach(e => { if (e.hidden) return; if (e.type === 'text') ph(e.text.content).forEach(x => push(bi, where, x)); if (e.type === 'image' && !resolveImg(e.image.src, M)) push(bi, where, `画像「${e.name || '画像'}」が空です`, '画像'); });
    if (b.type === 'free') elsCheck(b.elements, b.name || '自由ページ');
    if (b.type === 'profile') elsCheck(b.extras, 'プロフィール');
    if (b.type === 'work'){
      const n = b.title;
      ['title', 'subtitle', 'desc'].forEach(k => ph(b[k]).forEach(x => push(bi, n, x)));
      const i = b.info, S = ST(), on = k => !S.fieldOff.includes(k);
      if (on('tools') && !i.tools.length) push(bi, n, '使用ツールが選ばれていません', '情報');
      if (on('date') && !i.date.y) push(bi, n, '制作時期が未設定です', '情報');
      if (on('category') && !i.category && !i.categoryNote && !i.team) push(bi, n, '制作区分が未設定です', '情報');
      if (on('roles') && !i.roles.length && !i.roleNote) push(bi, n, '担当範囲が未設定です', '情報');
      if (b.showVideo && !+i.length) push(bi, n, '尺（秒）が未入力です', '情報');
      if (i.kind === 'MODELING' && on('poly') && !+i.poly.count) push(bi, n, 'ポリゴン数が未入力です', '情報');
      [i.categoryNote, i.roleNote].forEach(v => ph(v).forEach(x => push(bi, n, x)));
      (i.extra || []).forEach(m => ph(m.v).forEach(x => push(bi, n, `${m.k}: ${x}`)));
      if (!b.hero || !IM[b.hero]) push(bi, n, 'メイン画像が空です', '画像');
      if (b.showVideo && !b.videoUrl) push(bi, n, '動画URLが未入力です', '動画');
      b.details.forEach((d, di) => { const L = LAYOUTS[d.layout] || LAYOUTS.g6; for (let k = 0; k < L.n; k++){ const c = d.cells[k]; if (!c || !c.img || !IM[c.img]) push(bi, `${n} 詳細${di + 1}`, `画像「${c?.cap || k + 1}」が空です`, '画像'); } ph(d.note).forEach(x => push(bi, n, x)); elsCheck(d.extras, `${n} 詳細${di + 1}`); });
      elsCheck(b.heroExtras, n);
    }
  });
  return out;
}

  if (path.startsWith('theme.') && el.type === 'color') P.theme.preset = 'custom';
  if (el.dataset.bool !== undefined || el.dataset.struct !== undefined) return changed(true);
  changed(false);
  if (/^blocks\.\d+\.(title|name)$/.test(path)){ const t = document.querySelector(`.bitem[data-i="${selBlock}"] .t`); if (t) t.textContent = v; }
});
panel.addEventListener('click', async e => {
  const ch = e.target.closest('[data-chip]'); if (ch){ const arr = getPath(ch.dataset.chip) || []; const v = ch.dataset.val; setPath(ch.dataset.chip, arr.includes(v) ? arr.filter(x => x !== v) : [...arr, v]); return changed(true); }
  const ci = e.target.closest('[data-chipinv]'); if (ci){ const arr = getPath(ci.dataset.chipinv) || []; const v = ci.dataset.val; setPath(ci.dataset.chipinv, arr.includes(v) ? arr.filter(x => x !== v) : [...arr, v]); return changed(true); }
  const stg = e.target.closest('[data-settog]'); if (stg){ setPath(stg.dataset.settog, stg.dataset.val === 'true'); return changed(true); }
  const sv = e.target.closest('[data-setv]'); if (sv){ setPath(sv.dataset.setv, sv.dataset.val); return changed(true); }
  const mvb = e.target.closest('[data-mv]'); if (mvb){ const arr = getPath(mvb.dataset.mv); const i0 = +mvb.dataset.idx, i1 = i0 + (+mvb.dataset.dir); if (i1 >= 0 && i1 < arr.length){ [arr[i0], arr[i1]] = [arr[i1], arr[i0]]; changed(true); } return; }
  const rmb = e.target.closest('[data-rm]'); if (rmb){ const arr = getPath(rmb.dataset.rm); const v = arr[+rmb.dataset.idx]; if (!confirm(`「${v}」を一覧から削除しますか？（作品で選んでいる場合はそこからも外れます）`)) return; arr.splice(+rmb.dataset.idx, 1);
    P.blocks.forEach(b => { if (b.type === 'work'){ b.info.tools = b.info.tools.filter(x => x !== v); b.info.roles = b.info.roles.filter(x => x !== v); } }); P.profile.toolList = (P.profile.toolList || []).filter(x => x !== v); return changed(true); }
  const al = e.target.closest('[data-addlist]'); if (al){ const name = (prompt('追加する名前を入力してください') || '').trim(); if (!name) return; const list = getPath(al.dataset.addlist); if (!list.includes(name)) list.push(name); if (al.dataset.also){ const a = getPath(al.dataset.also) || []; if (!a.includes(name)) setPath(al.dataset.also, [...a, name]); } return changed(true); }
  const clr = e.target.closest('[data-clear]'); if (clr){ e.stopPropagation(); setPath(clr.dataset.clear, ''); return changed(true); }
  const pk = e.target.closest('[data-pick]'); if (pk && !e.target.closest('button')) return pickImage(id => setImageAt(pk.dataset.pick, id));
  const go = e.target.closest('[data-goto]'); if (go){ const bi = +go.dataset.goto; if (bi >= 0){ selBlock = bi; tab = 'pages'; renderAll(); scrollToBlock(bi); } else { tab = 'profile'; renderAll(); } return; }
  const add = e.target.closest('[data-add]'); if (add) return addByType(add.dataset.add);
  if (e.target.closest('#addFreeBtn')) return openFreeMenu(e.target.closest('#addFreeBtn'));
  const li = e.target.closest('.li'); const di = e.target.closest('[data-delimg]');
  if (di){ e.stopPropagation(); delete IM[di.dataset.delimg]; persist(); renderSide(); return; }
  if (li){ const id = li.dataset.img; const r = await imgRatio(id); const w = 480, h = Math.round(w / r); return addElement(ACTIVE, E('image', Math.round(PW / 2 - w / 2), Math.round(PH / 2 - h / 2), w, h, {name:'画像', image:{src:id, fit:'cover', px:50, py:50, radius:0, gray:false}})); }
  const item = e.target.closest('.bitem'); const b = e.target.closest('[data-act]');
  if (!b){ if (item){ selBlock = +item.dataset.i; renderAll(); scrollToBlock(selBlock); } return; }
  const a = b.dataset.act, i = b.dataset.i != null ? +b.dataset.i : selBlock, B = P.blocks, cur = B[selBlock];
  const mv = (arr, from, to) => { if (to < 0 || to >= arr.length) return false; arr.splice(to, 0, arr.splice(from, 1)[0]); return true; };
  switch (a){
    case 'up': if (mv(B, i, i - 1)) selBlock = i - 1; break;
    case 'down': if (mv(B, i, i + 1)) selBlock = i + 1; break;
    case 'toggle': B[i].enabled = !B[i].enabled; break;
    case 'addWork': B.splice(selBlock + 1, 0, newWork()); selBlock++; break;
    case 'dupBlock': { const c = clone(cur); c.id = uid('b'); if (c.type === 'work') c.title += '（コピー）'; else c.name = (c.name || '') + '（コピー）'; const reid = els => (els || []).forEach(x => x.id = uid('e')); reid(c.elements); reid(c.heroExtras); (c.details || []).forEach(d => reid(d.extras)); B.splice(selBlock + 1, 0, c); selBlock++; break; }
    case 'delBlock': if (!confirm(`「${cur.type === 'work' ? cur.title : cur.name}」を削除しますか？（↶ で取り消せます）`)) return; B.splice(selBlock, 1); if (!B.length) B.push(newWork()); selBlock = Math.min(selBlock, B.length - 1); SEL = {ctx:null, ids:[]}; break;
    case 'extraAdd': cur.info.extra.push({k:'', v:''}); break;
    case 'extraDel': cur.info.extra.splice(+b.dataset.mi, 1); break;
    case 'dAdd': cur.details.push({layout:'g4', label:'BREAKDOWN', note:'', extras:[], cells:Array.from({length:4}, () => ({img:'', cap:''}))}); break;
    case 'dDel': if (!confirm('この詳細ページを削除しますか？')) return; cur.details.splice(+b.dataset.di, 1); SEL = {ctx:null, ids:[]}; break;
    case 'dUp': mv(cur.details, +b.dataset.di, +b.dataset.di - 1); SEL = {ctx:null, ids:[]}; break;
    case 'dDown': mv(cur.details, +b.dataset.di, +b.dataset.di + 1); SEL = {ctx:null, ids:[]}; break;
    case 'theme': Object.assign(P.theme, THEMES[b.dataset.k], {preset:b.dataset.k}); break;
    case 'localFonts': return loadLocalFonts();
    case 'upload': $('#multiPick').value = ''; return $('#multiPick').click();
    case 'saveDir': return saveToDir();
    case 'openDir': return openDir();
    case 'reloadDir': return loadFromDir(dirHandle);
    case 'exportJson': return exportJson();
    case 'importJson': $('#jsonPick').value = ''; return $('#jsonPick').click();
    case 'pdf': return doPrint();
    case 'reset': if (!confirm('最初の状態に戻しますか？（↶ で取り消せます）')) return; P = defaultProject(); IM = {...IM, ...DEFAULT_IMAGES}; selBlock = 0; SEL = {ctx:null, ids:[]}; break;
    default: return;
  }
  changed(true);
});
function openFreeMenu(btn){
  closeMenu(); const r = btn.getBoundingClientRect();
  const m = document.createElement('div'); m.className = 'menu'; m.id = 'menu'; m.style.left = r.left + 'px'; m.style.top = (r.bottom + 4) + 'px';
  m.innerHTML = [['blank','白紙','何もないページ'],['section','セクション扉','大見出しで章を区切る'],['full','全面画像','1枚の画像を大きく見せる'],['text','テキストページ','自己PRや制作の考え方など']].map(([k, l, s]) => `<button data-free="${k}">${l}<small>${s}</small></button>`).join('');
  document.body.appendChild(m);
  m.addEventListener('click', e => { const b = e.target.closest('[data-free]'); if (!b) return; const t = freeTemplate(b.dataset.free); P.blocks.splice(selBlock + 1, 0, {id:uid('b'), type:'free', enabled:true, ...t}); selBlock++; closeMenu(); changed(true); scrollToBlock(selBlock); });
  setTimeout(() => document.addEventListener('pointerdown', menuAway), 0);
}
function openTokMenu(btn){
  closeMenu(); const r = btn.getBoundingClientRect();
  const m = document.createElement('div'); m.className = 'menu'; m.id = 'menu'; m.style.left = r.left + 'px'; m.style.top = (r.bottom + 4) + 'px';
  m.innerHTML = TOKENS.map(([k, l]) => `<button data-tok="${k}">${l}<small>{${k}}</small></button>`).join('');
  document.body.appendChild(m);
  m.addEventListener('click', e => { const b = e.target.closest('[data-tok]'); if (!b) return; closeMenu(); const k = b.dataset.tok; const mono = ['page', 'total', 'year', 'label', 'romaji'].includes(k);
    addElement(ACTIVE, E('text', PW / 2 - 200, PH / 2 - 20, 400, 40, {name:TOKENS.find(t => t[0] === k)[1], text:T(k === 'page' ? '{page} / {total}' : `{${k}}`, mono ? {font:'mono', size:14, weight:400, color:'muted', ls:0.06} : {size:24})})); });
  setTimeout(() => document.addEventListener('pointerdown', menuAway), 0);
}
function menuAway(e){ if (!e.target.closest('#menu')) closeMenu(); }
function closeMenu(){ const m = $('#menu'); if (m) m.remove(); document.removeEventListener('pointerdown', menuAway); }
function scrollToBlock(bi){ requestAnimationFrame(() => requestAnimationFrame(() => { const el = document.querySelector(`.pbox[data-bi="${bi}"]`); if (el) el.scrollIntoView({behavior:'smooth', block:'start'}); })); }
// left panel drag & drop
panel.addEventListener('dragstart', e => {
  const li = e.target.closest('.li'); if (li){ e.dataTransfer.setData('text/x-img', li.dataset.img); e.dataTransfer.effectAllowed = 'copy'; return; }
  const it = e.target.closest('.bitem'); if (it){ dragFrom = +it.dataset.i; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/x-block', it.dataset.i); }
});
let dragFrom = null;
panel.addEventListener('dragover', e => {
  const types = [...e.dataTransfer.types];
  const d = e.target.closest('[data-pick]'); if (d && (types.includes('Files') || types.includes('text/x-img'))){ e.preventDefault(); d.classList.add('over'); return; }
  const it = e.target.closest('.bitem'); if (it && dragFrom != null){ e.preventDefault(); document.querySelectorAll('.bitem.dragover').forEach(x => x.classList.remove('dragover')); it.classList.add('dragover'); }
});
panel.addEventListener('dragleave', e => { const d = e.target.closest('[data-pick]'); if (d) d.classList.remove('over'); });
panel.addEventListener('drop', async e => {
  const d = e.target.closest('[data-pick]');
  if (d){ const {file, lib} = dropInfo(e); if (file || lib){ e.preventDefault(); return setImageAt(d.dataset.pick, lib || file); } }
  const it = e.target.closest('.bitem');
  if (it && dragFrom != null){ e.preventDefault(); const to = +it.dataset.i; const B = P.blocks; const selId = B[selBlock]?.id; B.splice(to, 0, B.splice(dragFrom, 1)[0]); selBlock = B.findIndex(b => b.id === selId); if (selBlock < 0) selBlock = to; dragFrom = null; SEL = {ctx:null, ids:[]}; changed(true); }
});
panel.addEventListener('dragend', () => { dragFrom = null; document.querySelectorAll('.dragover').forEach(x => x.classList.remove('dragover')); });

// =====================================================================
//  fonts, folder, json, print
// =====================================================================
async function loadLocalFonts(){
  if (!('queryLocalFonts' in window)){ toast('このブラウザでは一覧を読めません。フォント名を直接入力してください'); return; }
  try { const fs = await window.queryLocalFonts(); localFonts = [...new Set(fs.map(f => f.family))].sort(); toast(`${localFonts.length} 個のフォントを読み込みました。入力欄の候補に出ます`); renderSide(); }
  catch(e){ toast('フォントの読み込みが許可されませんでした'); }
}
async function saveToDir(){
  if (folderReady){ await folderSave(); toast(`「${dirHandle.name}」に保存しました`); return; }
  try { const h = await window.showDirectoryPicker({mode:'readwrite', id:'portfolio'}); await connectFolder(h); } catch(e){ if (e.name !== 'AbortError') toast('保存できませんでした：' + e.message); }
}
async function openDir(){ try { const h = await window.showDirectoryPicker({mode:'readwrite', id:'portfolio'}); await connectFolder(h); } catch(e){ if (e.name !== 'AbortError') toast('開けませんでした：' + e.message); } }
async function loadFromDir(h, opt = {}){
  try {
    let fh; try { fh = await h.getFileHandle('project.json'); } catch(e){ toast('project.json がありません'); return; }
    const file = await fh.getFile(); const data = JSON.parse(await file.text()); const map = data.images || {}; delete data.images;
    for (const [id, rel] of Object.entries(map)){
      if (IM[id]) continue; // image ids never change content
      try { let d = h; const parts = rel.split('/'); for (const part of parts.slice(0, -1)) d = await d.getDirectoryHandle(part); const f = await (await d.getFileHandle(parts.at(-1))).getFile(); IM[id] = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(f); }); delete URLC[id]; } catch(e){ console.warn('missing image', rel); }
    }
    const keepSel = selBlock;
    P = normalize(data); lastMtime = file.lastModified; dirty = false; savedAt = new Date(file.lastModified);
    undoStack = []; redoStack = []; lastSnap = JSON.stringify(P);
    selBlock = keepSel; afterLoad(false); hideBanner('conflict'); setStatus();
    if (!opt.silent) toast(`「${h.name}」から読み込みました`);
  } catch(e){ toast('読み込めませんでした：' + e.message); }
}
function exportJson(){
  const images = {}; usedImageIds().forEach(id => { if (IM[id]) images[id] = IM[id]; });
  const blob = new Blob([JSON.stringify({...P, embeddedImages:images})], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'portfolio-project.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
$('#jsonPick').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try { const data = JSON.parse(await f.text()); Object.assign(IM, data.embeddedImages || {}); delete data.embeddedImages; delete data.images; snapshot(); P = normalize(data); afterLoad(); snapshot(); toast('読み込みました'); } catch(err){ toast('読み込めませんでした'); }
});
function doPrint(){ if (EDITING) finishEdit(); setSel(null, []); toast('「PDFに保存」「余白なし」「背景のグラフィック」をオンにしてください'); setTimeout(() => window.print(), 350); }

// toolbar
$('#pdfBtn').addEventListener('click', doPrint);
$('#undoBtn').addEventListener('click', undo);
$('#redoBtn').addEventListener('click', redo);
$('#toolbar').addEventListener('click', e => { const a = e.target.closest('[data-add]'); if (a) addByType(a.dataset.add); });
$('#tokBtn').addEventListener('click', e => openTokMenu(e.currentTarget));
$('#zoom').addEventListener('input', e => setZoom(+e.target.value));
$('#zoomIn').addEventListener('click', () => setZoom(getZoom() * 1.25));
$('#zoomOut').addEventListener('click', () => setZoom(getZoom() / 1.25));
$('#zoomFit').addEventListener('click', () => { delete $('#zoom').dataset.touched; setZoom(fitZoom()); delete $('#zoom').dataset.touched; });
$('#zoom100').addEventListener('click', () => setZoom(1));
$('#stage').addEventListener('wheel', e => { if (!(e.ctrlKey || e.metaKey)) return; e.preventDefault(); setZoom(getZoom() * Math.exp(-e.deltaY * 0.0015), e.clientX, e.clientY); }, {passive:false});
// ---------- image viewer (lightbox) ----------
const LB = {s:1, x:0, y:0, w:0, h:0, drag:null};
function lbApply(){ const im = $('#lbImg'); im.style.transform = `translate(${LB.x}px,${LB.y}px) scale(${LB.s})`; $('#lbPct').textContent = Math.round(LB.s * 100) + '%'; }
function lbFit(){ const W = innerWidth, H = innerHeight - 70; LB.s = Math.min(W / LB.w, H / LB.h, 1) * 0.96; LB.x = (W - LB.w * LB.s) / 2; LB.y = (H - LB.h * LB.s) / 2 + 10; lbApply(); }
function lbZoom(s, cx, cy){ s = Math.max(0.05, Math.min(8, s)); cx = cx ?? innerWidth / 2; cy = cy ?? innerHeight / 2; LB.x = cx - (cx - LB.x) * s / LB.s; LB.y = cy - (cy - LB.y) * s / LB.s; LB.s = s; lbApply(); }
function openLB(url){ if (!url) return; const im = $('#lbImg'); im.onload = () => { LB.w = im.naturalWidth; LB.h = im.naturalHeight; lbFit(); }; im.src = url; $('#lb').classList.add('show'); }
function closeLB(){ $('#lb').classList.remove('show'); }
$('#lb').addEventListener('wheel', e => { e.preventDefault(); lbZoom(LB.s * Math.exp(-e.deltaY * 0.0018), e.clientX, e.clientY); }, {passive:false});
$('#lb').addEventListener('pointerdown', e => { if (e.target.closest('.bar')) return; LB.drag = {x:e.clientX - LB.x, y:e.clientY - LB.y}; $('#lb').classList.add('drag'); });
window.addEventListener('pointermove', e => { if (!LB.drag) return; LB.x = e.clientX - LB.drag.x; LB.y = e.clientY - LB.drag.y; lbApply(); });
window.addEventListener('pointerup', () => { LB.drag = null; $('#lb').classList.remove('drag'); });
$('#lb').addEventListener('dblclick', e => { if (e.target.closest('.bar')) return; if (LB.s < 0.99) lbZoom(1, e.clientX, e.clientY); else lbFit(); });
$('#lbFit').addEventListener('click', lbFit); $('#lb100').addEventListener('click', () => lbZoom(1)); $('#lbClose').addEventListener('click', closeLB);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#lb').classList.contains('show')){ e.stopImmediatePropagation(); closeLB(); } }, true);
window.addEventListener('resize', () => { if (!$('#zoom').dataset.touched){ zoom = null; renderPages(); } });

// =====================================================================
//  boot
// =====================================================================
if (HOSTED && 'serviceWorker' in navigator){ navigator.serviceWorker.register('./sw.js').catch(() => {}); }
(async function boot(){
  await DB.open();
  const saved = await DB.get('project'); const savedIm = await DB.get('images');
  IM = {...DEFAULT_IMAGES, ...(savedIm || {})};
  try { P = saved ? normalize(JSON.parse(saved)) : defaultProject(); } catch(e){ console.error(e); P = defaultProject(); }
  try { const h = await DB.get('dir'); if (h) dirHandle = h; } catch(e){}
  lastSnap = JSON.stringify(P);
  renderAll(); persist(false);
  await startFolder();
  if (document.fonts) document.fonts.ready.then(() => renderPages());
})();
</script>
